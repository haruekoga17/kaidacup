<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#102a22}
.card{width:1200px;height:630px;position:relative;overflow:hidden;color:#fff;font-family:"Noto Serif CJK JP","Yu Mincho",serif}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 53%;filter:saturate(.84) brightness(.81)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,27,18,.94) 0%,rgba(10,35,23,.84) 38%,rgba(10,35,23,.48) 67%,rgba(10,35,23,.10) 100%),linear-gradient(0deg,rgba(5,20,13,.48),transparent 44%)}
.frame{position:absolute;inset:22px;border:1px solid rgba(205,177,107,.82)}
.frame:before{content:"";position:absolute;inset:7px;border:1px solid rgba(255,255,255,.16)}
.content{position:absolute;left:92px;top:115px;width:865px}
.kicker{font-family:Arial,sans-serif;font-size:16px;letter-spacing:.27em;color:#ddc584;display:flex;align-items:center;gap:13px}
.kicker:before{content:"";width:42px;height:1px;background:#c7a96b}
.mark{position:absolute;right:0;top:-5px;width:53px;height:53px;border:1px solid #c8ae72;border-radius:50%;display:grid;place-items:center;color:#e0ca91;font-size:25px}
h1{font-weight:500;font-size:54px;letter-spacing:.07em;line-height:1.25;margin:27px 0 19px;text-shadow:0 2px 12px #08170fb0;white-space:nowrap}
.rule{height:1px;width:610px;background:linear-gradient(90deg,#c8ae72,rgba(200,174,114,.1));margin-bottom:18px}
.date{font-size:28px;letter-spacing:.09em;color:#fff;font-weight:400}
.place{position:absolute;left:93px;bottom:61px;color:#e7dfc9;font-family:Arial,sans-serif;font-size:14px;letter-spacing:.16em}
.place span{color:#d6bc7b;padding:0 11px}
</style>
<div class="card"><img class="photo" src="course-photo.jpg" alt=""><div class="shade"></div><div class="frame"></div><div class="content"><div class="kicker">AUTUMN GOLF COMPETITION <span class="mark">海</span></div><h1>焼鳥海田ゴルフコンペ</h1><div class="rule"></div><div class="date">2026年10月14日（水）</div></div><div class="place">八女上陽ゴルフ倶楽部 <span>·</span> IN COURSE</div></div>
</html>
